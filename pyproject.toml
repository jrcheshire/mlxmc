[project]
authors = [{name = "Jamie Cheshire", email = "cheshire@caltech.edu"}]
dependencies = ["mlx>=0.29.3,<0.30", "numpy>=2,<3"]
description = "MCMC samplers in Apple MLX"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "mlxmc"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
mlxmc = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.10.9,<4"
pytest = ">=8,<9"

[tool.pytest.ini_options]
testpaths = ["tests"]
